<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCS - Transaction Processing</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared-style.css" />
    <link rel="stylesheet" href="transaction.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">T</div>
        <span class="brand-name">TCS Bank</span>
      </div>
      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html" class="nav-link">
          <span class="nav-icon">⊞</span> Dashboard
        </a>
        <a href="../customer/customer.html" class="nav-link">
          <span class="nav-icon">◎</span> Customers
        </a>
        <a href="../transaction/transaction.html" class="nav-link active">
          <span class="nav-icon">⇄</span> Transactions
        </a>
        <a href="../loan/loan.html" class="nav-link">
          <span class="nav-icon">◈</span> Loans
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="logout-link"> <span>⏻</span> Logout </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Finance Portal</p>
          <h1 class="page-title">Transaction Processing</h1>
        </div>
        <div id="profileInfo" class="profile-chip">
          <div class="profile-avatar" id="userInitial">E</div>
          <div class="profile-details">
            <span class="profile-name" id="userName">Employee</span>
            <span class="profile-id" id="userId">ID: 0000000</span>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-card-header">
          <div class="form-card-icon">⇄</div>
          <div>
            <h2 class="form-card-title">Record Transaction</h2>
            <p class="form-card-subtitle">
              Fill in all details to capture and store transaction information
            </p>
          </div>
        </div>

        <form
          id="transactionForm"
          onsubmit="handleTransaction(event)"
          autocomplete="off"
        >
          <!-- Section: Transaction Info -->
          <p class="section-label">Transaction Details</p>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transId">Transaction ID</label>
              <input
                type="text"
                id="transId"
                class="field-input"
                placeholder="e.g. TXN00123"
                required
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="transDate">Date</label>
              <input type="date" id="transDate" class="field-input" required />
            </div>
          </div>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transType"
                >Mode of Transaction</label
              >
              <select id="transType" class="field-input field-select" required>
                <option value="">Select mode</option>
                <option value="Deposit">Deposit</option>
                <option value="Withdrawal">Withdrawal</option>
                <option value="Transfer">Transfer</option>
                <option value="Online">Online</option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label" for="transAmount"
                >Amount of Transaction (₹)</label
              >
              <div class="amount-wrapper">
                <span class="amount-prefix">₹</span>
                <input
                  type="number"
                  id="transAmount"
                  class="field-input amount-input"
                  placeholder="0.00"
                  min="1"
                  required
                />
              </div>
            </div>
          </div>

          <div class="form-divider"></div>

          <!-- Section: Customer Info -->
          <p class="section-label">Customer Information</p>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transSsn">Customer SSN ID</label>
              <input
                type="text"
                id="transSsn"
                class="field-input"
                placeholder="e.g. 123-45-6789"
                required
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="transCustomerName"
                >Customer Name</label
              >
              <input
                type="text"
                id="transCustomerName"
                class="field-input"
                placeholder="Full name"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transOccupation"
                >Occupation</label
              >
              <input
                type="text"
                id="transOccupation"
                class="field-input"
                placeholder="e.g. Engineer"
                required
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="transContact"
                >Contact Number</label
              >
              <input
                type="tel"
                id="transContact"
                class="field-input"
                placeholder="e.g. 9876543210"
                required
              />
            </div>
          </div>
          <div class="field-group mb-20">
            <label class="field-label" for="transAddress">Address</label>
            <textarea
              id="transAddress"
              class="field-input field-textarea"
              placeholder="Enter full address"
              rows="2"
              required
            ></textarea>
          </div>

          <div class="form-divider"></div>

          <!-- Section: Account & ID Info -->
          <p class="section-label">Account & Identity</p>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transAccount">Account ID</label>
              <input
                type="text"
                id="transAccount"
                class="field-input"
                placeholder="e.g. ACC0012345"
                required
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="transAadhar"
                >Aadhar Card No</label
              >
              <input
                type="text"
                id="transAadhar"
                class="field-input"
                placeholder="12-digit Aadhar"
                maxlength="14"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="field-group">
              <label class="field-label" for="transPan">PAN Card No</label>
              <input
                type="text"
                id="transPan"
                class="field-input"
                placeholder="e.g. ABCDE1234F"
                maxlength="10"
                required
              />
            </div>
            <div class="field-group">
              <!-- Spacer -->
            </div>
          </div>

          <div class="form-divider"></div>

          <button type="submit" class="process-btn">
            <span class="btn-icon">⇄</span>
            Process Transaction
          </button>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-wrapper" style="display: none">
      <div class="toast-inner" id="toastInner">
        <span id="toastIcon" class="toast-icon">✓</span>
        <span id="toastBody" class="toast-text"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="transaction.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
