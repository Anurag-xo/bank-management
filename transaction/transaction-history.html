<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCS - Transaction History</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../shared-style.css" />
    <link rel="stylesheet" href="transaction-history.css" />
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">T</div>
        <span class="brand-name">TCS Bank</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html" class="nav-link">
          <span class="nav-icon">⊞</span> Dashboard
        </a>
        <a href="../customer/customer.html" class="nav-link">
          <span class="nav-icon">◎</span> Customers
        </a>
        <a href="transaction.html" class="nav-link">
          <span class="nav-icon">⇄</span> Transactions
        </a>
        <a href="transaction-history.html" class="nav-link active">
          <span class="nav-icon">🕒</span> History
        </a>
        <a href="../loan/loan.html" class="nav-link">
          <span class="nav-icon">◈</span> Loans
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="../index.html" class="logout-link"> <span>⏻</span> Logout </a>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Finance Portal</p>
          <h1 class="page-title">Transaction History</h1>
        </div>

        <div id="profileInfo" class="profile-chip">
          <div class="profile-avatar" id="userInitial">E</div>
          <div class="profile-details">
            <span class="profile-name" id="userName">Employee</span>
            <span class="profile-id" id="userId">ID: 0000000</span>
          </div>
        </div>
      </div>

      <!-- HISTORY CARD -->
      <div class="history-card">
        <div class="history-header">
          <h2 class="history-title">Recent Transactions</h2>
          <p class="history-subtitle">Complete log of recorded transactions</p>
        </div>

        <!-- TABLE HEADER -->
        <div class="history-row header">
          <span>Transaction ID</span>
          <span>Mode</span>
          <span>Amount</span>
          <span>Date & Time</span>
          <span>Action</span>
        </div>

        <!-- TRANSACTION ROWS -->
        <div id="transactionList"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast-wrapper" style="display: none">
      <div class="toast-inner" id="toastInner">
        <span id="toastIcon" class="toast-icon">✓</span>
        <span id="toastBody" class="toast-text"></span>
      </div>
    </div>

    <script src="transaction-history.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
``
