<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS Bank - Registration</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared-style.css">
    <link rel="stylesheet" href="register.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-box shadow-lg" style="max-width: 500px;">
            <div class="auth-header text-center mb-4">
                <div class="auth-logo mb-3">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Join TCS Bank</h1>
                <p class="text-muted small">Employee Registration Form</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Employee ID (Auto-Generated)</label>
                    <input type="text" id="empId" class="form-control bg-light" readonly>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">First Name</label>
                        <input type="text" id="firstName" class="form-control" placeholder="First" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Last" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@tcsbank.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Confirm</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Address</label>
                    <textarea id="address" class="form-control" rows="2" placeholder="Full residential address" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Contact Number</label>
                    <input type="text" id="contact" class="form-control" maxlength="10" placeholder="10-digit mobile" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    Create Account <i class="bi bi-check2-circle"></i>
                </button>
            </form>

            <div class="auth-footer mt-4 text-center">
                <p class="small text-muted mb-2">Already have an account? <a href="../login/login.html" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                <a href="../landing/index.html" class="small text-muted text-decoration-none"><i class="bi bi-house-door me-1"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="position-fixed top-0 end-0 p-3" style="z-index: 1060; display: none;">
        <div class="toast show align-items-center text-white bg-dark border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
    <script src="register.js"></script>
</body>
</html>
