<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS - Loan Management</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Shared Layout & Sidebar Styles -->
    <link rel="stylesheet" href="../shared-style.css">
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="loan.css">
</head>

<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2><i class="bi bi-bank brand-icon"></i> Sentinel Bank</h2>
        </div>

        <ul class="sidebar-nav">
            <!-- Dashboard -->
            <li class="nav-item">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>

            <!-- Customers -->
            <li class="nav-item has-dropdown">
                <a href="../customer/customer.html" class="nav-link">
                    <i class="bi bi-people-fill"></i> Customers
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="../customer/view-customers.html" class="dropdown-link">View Customers</a></li>
                    <li><a href="../customer/customer.html" class="dropdown-link">Add Customer</a></li>
                </ul>
            </li>

            <!-- Transactions -->
            <li class="nav-item has-dropdown">
                <a href="../transaction/transaction.html" class="nav-link">
                    <i class="bi bi-arrow-left-right"></i> Transactions
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="../transaction/transaction-history.html" class="dropdown-link">View Transactions</a>
                    </li>
                    <li><a href="../transaction/transaction.html" class="dropdown-link">New Transaction</a></li>
                </ul>
            </li>

            <!-- Loans -->
            <li class="nav-item has-dropdown">
                <a href="loan.html" class="nav-link active">
                    <i class="bi bi-cash-stack"></i> Loans
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="loan.html" class="dropdown-link">Apply Loan</a></li>
                    <li><a href="loan-status.html" class="dropdown-link">Loan Status</a></li>
                </ul>
            </li>
        </ul>

        <div class="sidebar-logout">
            <a href="../landing/index.html" class="nav-link">
                <i class="bi bi-box-arrow-left"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1 class="h3 mb-0">Loan Management</h1>
            <div class="header-profile">
                <div class="profile-info" id="profileInfo">
                    <b>Name:</b> <span id="userName">Employee</span> |
                    <b>ID:</b> <span id="userId">0000000</span>
                </div>
                <a href="#" class="profile-icon-btn" title="My Profile">
                    <i class="bi bi-person-fill"></i>
                </a>
            </div>
        </div>

        <div class="content-box" style="max-width: 700px;">
            <h2 class="h5 mb-4 fw-bold"><i class="bi bi-file-earmark-text me-2"></i>Loan Request Form</h2>
            <form id="loanForm" onsubmit="return false;">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Customer SSN ID</label>
                        <input type="text" id="loanSsn" class="form-control" placeholder="Enter SSN" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Loan Amount (₹)</label>
                        <input type="number" id="loanAmount" class="form-control" placeholder="Enter Amount" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Loan Type</label>
                    <select id="loanType" class="form-select">
                        <option value="Home">Home Loan</option>
                        <option value="Personal">Personal Loan</option>
                        <option value="Car">Car Loan</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-success px-4 fw-bold"
                        onclick="handleLoanAction('apply')">Apply</button>
                    <button type="button" class="btn btn-warning px-4 fw-bold"
                        onclick="handleLoanAction('update')">Update</button>
                    <button type="button" class="btn btn-danger px-4 fw-bold"
                        onclick="handleLoanAction('cancel')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="position-fixed top-0 end-0 p-3" style="z-index: 1060; display: none;">
        <div class="toast show align-items-center text-white bg-dark border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
    <script src="loan.js"></script>
    <script src="../profile.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
    </script>
</body>

</html>
