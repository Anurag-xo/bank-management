<app-navbar></app-navbar>

<div class="auth-layout">
  <div class="auth-left">
    <div class="auth-brand">
      <img src="assets/sentinel_logo.png" alt="Logo" class="auth-logo">
      <h1>Sentinel Bank</h1>
      <p>Experience the next generation of secure, fast, and intelligent banking tailored for your financial success.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2>Welcome Back</h2>
        <p>Please enter your details to sign in.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label>
            <i class="bi bi-person"></i> Username
          </label>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label>
            <i class="bi bi-lock"></i> Password
          </label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="error-message" *ngIf="errorVisible">
          <i class="bi bi-exclamation-circle"></i> Invalid username or password.
        </div>

        <button type="submit" class="btn-auth">Sign In</button>

        <div class="auth-footer">
          <span>Don't have an account?</span>
          <a routerLink="/register">Register here</a>
        </div>
      </form>
    </div>
  </div>
</div>
