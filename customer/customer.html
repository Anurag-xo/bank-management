<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS - Add Customer</title>
    <!-- Bootstrap 5 (Core only) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared-style.css">
    <!-- Page Specific Styles (Custom CSS) -->
    <link rel="stylesheet" href="customer.css">
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar (Shared Component) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2><i class="bi bi-bank brand-icon"></i> TCS Bank</h2>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>
            <li class="nav-item has-dropdown">
                <a href="customer.html" class="nav-link active">
                    <i class="bi bi-people-fill"></i> Customers
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="view-customers.html" class="dropdown-link">View Customers</a></li>
                    <li><a href="customer.html" class="dropdown-link">Add Customer</a></li>
                </ul>
            </li>
            <li class="nav-item has-dropdown">
                <a href="../transaction/transaction.html" class="nav-link">
                    <i class="bi bi-arrow-left-right"></i> Transactions
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="../transaction/transaction-history.html" class="dropdown-link">View Transactions</a></li>
                    <li><a href="../transaction/transaction.html" class="dropdown-link">New Transaction</a></li>
                </ul>
            </li>
            <li class="nav-item has-dropdown">
                <a href="../loan/loan.html" class="nav-link">
                    <i class="bi bi-cash-stack"></i> Loans
                    <i class="bi bi-chevron-right dropdown-arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="../loan/loan.html" class="dropdown-link">Apply Loan</a></li>
                    <li><a href="../loan/loan-status.html" class="dropdown-link">Loan Status</a></li>
                </ul>
            </li>
        </ul>
        <div class="sidebar-logout">
            <a href="../landing/index.html" class="nav-link">
                <i class="bi bi-box-arrow-left"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1 class="page-title">Customer Management</h1>
            <div class="header-profile">
                <div class="profile-info">
                    <b>Name:</b> <span id="userName">Employee</span> | <b>ID:</b> <span id="userId">0000000</span>
                </div>
                <a href="#" class="profile-icon-btn"><i class="bi bi-person-fill"></i></a>
            </div>
        </div>

        <div class="content-box">
            <h2 class="section-title"><i class="bi bi-person-plus-fill me-2"></i>Manage Customers</h2>
            <form id="customerForm" onsubmit="return false;">
                <div class="form-grid">
                    <div class="custom-form-group">
                        <label class="custom-label">Customer SSN ID</label>
                        <input type="text" id="customerSsn" class="custom-input" placeholder="Enter SSN" required>
                    </div>
                    <div class="custom-form-group">
                        <label class="custom-label">Customer Name</label>
                        <input type="text" id="customerName" class="custom-input" placeholder="Enter Name" required>
                    </div>
                    <div class="custom-form-group">
                        <label class="custom-label">Account Number</label>
                        <input type="text" id="accountNumber" class="custom-input" placeholder="Enter Account No">
                    </div>
                    <div class="custom-form-group">
                        <label class="custom-label">Email Address</label>
                        <input type="email" id="customerEmail" class="custom-input" placeholder="Enter Email">
                    </div>
                    <div class="custom-form-group full-width">
                        <label class="custom-label">Address</label>
                        <textarea id="customerAddress" class="custom-input" rows="2" placeholder="Enter Full Address"></textarea>
                    </div>
                    <div class="custom-form-group full-width">
                        <label class="custom-label">Contact Number</label>
                        <input type="text" id="customerContact" class="custom-input" maxlength="10" placeholder="Enter 10-digit number">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn-blue btn-blue-primary" onclick="handleCustomerAction('add')">
                        <i class="bi bi-plus-lg me-1"></i> Add
                    </button>
                    <button type="button" class="btn-blue btn-blue-secondary" onclick="handleCustomerAction('edit')">
                        <i class="bi bi-pencil-square me-1"></i> Edit
                    </button>
                    <button type="button" class="btn-blue btn-blue-accent" onclick="handleCustomerAction('delete')">
                        <i class="bi bi-trash3-fill me-1"></i> Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="position-fixed top-0 end-0 p-3" style="z-index: 1060; display: none">
        <div class="toast show align-items-center text-white bg-dark border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
    <script src="customer.js"></script>
    <script src="../profile.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }
    </script>
</body>
</html>
