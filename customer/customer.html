<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCS - Customer Management</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Shared Layout & Sidebar Styles -->
    <link rel="stylesheet" href="../shared-style.css" />
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="customer.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar bg-dark text-white">
      <h2 class="text-primary mb-4 text-center fw-bold">TCS Bank</h2>
      <a href="dashboard.html">Dashboard</a>
      <a
        href="javascript:void(0);"
        onclick="toggleCustomerMenu()"
        class="dropdown-btn"
      >
        Customers ▼
      </a>

      <div id="customerSubmenu" class="submenu">
        <a href="view-customers.html">View Customers</a>
        <a href="customer.html">Add Customer</a>
      </div>

      <a href="transaction.html">Transactions</a>
      <a href="loan.html">Loans</a>
      <br />
      <hr class="text-secondary" />
      <br />
      <a href="index.html" class="text-danger">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header d-flex justify-content-between align-items-center">
        <div class="page-title-wrapper">
          <div class="icon-circle">👥</div>
          <div class="page-title-text">
            <h1 class="h3 mb-0">Customer Management</h1>
          </div>
        </div>
        <div id="profileInfo" class="small">
          <b>Name:</b> <span id="userName">Employee</span> | <b>ID:</b>
          <span id="userId">0000000</span>
        </div>
      </div>

      <div class="content-box shadow-sm">
        <h2 class="h5 mb-4 fw-bold">Manage Customers</h2>
        <form id="customerForm" onsubmit="return false;">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold small">Customer SSN ID</label>
              <input
                type="text"
                id="customerSsn"
                class="form-control"
                placeholder="Enter SSN"
                required
              />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold small">Customer Name</label>
              <input
                type="text"
                id="customerName"
                class="form-control"
                placeholder="Enter Name"
                required
              />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold small">Account Number</label>
              <input
                type="text"
                id="accountNumber"
                class="form-control"
                placeholder="Enter Account No"
              />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold small">Email Address</label>
              <input
                type="email"
                id="customerEmail"
                class="form-control"
                placeholder="Enter Email"
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small">Address</label>
            <textarea
              id="customerAddress"
              class="form-control"
              rows="2"
              placeholder="Enter Address"
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small">Contact Number</label>
            <input
              type="text"
              id="customerContact"
              class="form-control"
              maxlength="10"
              placeholder="Enter Contact"
            />
          </div>

          <div class="d-flex gap-2 mt-4">
            <button
              type="button"
              class="btn btn-success px-4 fw-bold"
              onclick="handleCustomerAction('add')"
            >
              Add
            </button>
            <button
              type="button"
              class="btn btn-warning px-4 fw-bold"
              onclick="handleCustomerAction('edit')"
            >
              Edit
            </button>
            <button
              type="button"
              class="btn btn-danger px-4 fw-bold"
              onclick="handleCustomerAction('delete')"
            >
              Delete
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="position-fixed top-0 end-0 p-3"
      style="z-index: 1060; display: none"
    >
      <div class="toast show align-items-center text-white bg-dark border-0">
        <div class="d-flex">
          <div class="toast-body" id="toastBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="customer.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
