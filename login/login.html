<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS Bank - Employee Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared-style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-box shadow-lg">
            <div class="auth-header text-center mb-4">
                <div class="auth-logo mb-3">
                    <i class="bi bi-bank2"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">TCS Bank</h1>
                <p class="text-muted small">Employee Login Portal</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Employee ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" id="loginEmpId" class="form-control" placeholder="Enter your ID" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    Login to Dashboard <i class="bi bi-arrow-right-short"></i>
                </button>
            </form>

            <div class="auth-footer mt-4 text-center">
                <p class="small text-muted mb-2">New to the bank? <a href="../register/register.html" class="text-primary fw-bold text-decoration-none">Register Now</a></p>
                <a href="../landing/index.html" class="small text-muted text-decoration-none"><i class="bi bi-house-door me-1"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Success Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="text-success mb-3" style="font-size: 3rem;">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h2 class="mb-2">Success!</h2>
                <p class="text-muted">Login successful. Welcome back to the portal.</p>
                <button class="btn btn-primary mt-3 px-5 fw-bold" onclick="closeLoginModal()">Go to Dashboard</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="position-fixed top-0 end-0 p-3" style="z-index: 1060; display: none;">
        <div class="toast show align-items-center text-white bg-dark border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
    <script src="login.js"></script>
</body>
</html>
