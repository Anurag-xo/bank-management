<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Bank - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../shared-style.css">
    <style>
        body {
            background-color: var(--background);
            margin: 0;
            overflow-x: hidden;
        }

        .split-layout {
            display: flex;
            min-height: calc(100vh - 60px);
            /* Account for navbar */
        }

        .split-left {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: var(--surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .split-left::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(238, 233, 169, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .split-left::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(245, 240, 204, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .brand-content {
            z-index: 2;
            text-align: center;
            max-width: 500px;
        }

        .brand-icon-large {
            font-size: 5rem;
            color: var(--secondary);
            margin-bottom: 20px;
            display: inline-block;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }

        .brand-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .split-right {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-color: var(--background);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(69, 66, 56, 0.08);
            position: relative;
        }

        .login-card-header {
            margin-bottom: 35px;
            text-align: center;
        }

        .login-card-header h3 {
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 2rem;
        }

        .form-floating>label {
            color: var(--text-muted);
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid rgba(69, 66, 56, 0.1);
            padding: 1rem 0.75rem;
            background-color: #faf9f5;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(69, 66, 56, 0.1);
            background-color: var(--surface);
        }

        .btn-login {
            background-color: var(--primary);
            color: white;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-top: 15px;
            border: none;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(69, 66, 56, 0.2);
            color: white;
        }

        @media (max-width: 992px) {
            .split-layout {
                flex-direction: column;
            }

            .split-left {
                flex: none;
                padding: 60px 20px;
            }

            .brand-title {
                font-size: 2.5rem;
            }

            .split-right {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <script src="../assets/navbar.js"></script>
    <script src="../assets/auth.js"></script>

    <div class="split-layout">
        <!-- Left Side: Branding -->
        <div class="split-left">
            <div class="brand-content">
                <img src="../assets/sentinel_logo.png" alt="Sentinel Bank Logo" style="height: 240px; width: 240px; border-radius: 30px; margin-bottom: 35px; animation: float 6s ease-in-out infinite;">
                <h1 class="brand-title">Sentinel Bank</h1>
                <p class="brand-subtitle">Experience the next generation of secure, fast, and intelligent banking
                    tailored for your financial success.</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="split-right">
            <div class="login-card">
                <div class="login-card-header">
                    <h3>Welcome Back</h3>
                    <p class="text-muted">Please enter your details to sign in.</p>
                </div>


                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="Username" required>
                        <label for="username"><i class="bi bi-person me-2"></i>Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                    </div>

                    <div id="errorMsg" class="alert alert-danger"
                        style="display:none; font-size: 0.9rem; border-radius: 10px;">
                        <i class="bi bi-exclamation-circle me-2"></i> Invalid username or password.
                    </div>

                    <button type="submit" class="btn btn-login w-100">Sign In</button>

                    <div class="text-center mt-4">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="../register/register.html" class="text-decoration-none fw-bold ms-1"
                            style="color: var(--primary);">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>

</html>
