<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS Bank - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-box shadow">
        <h1 class="text-primary fw-bold">TCS Bank</h1>
        <p>Employee Login Portal</p>
        
        <form id="loginForm">
            <div class="form-group mb-3 text-start">
                <label class="form-label fw-bold">Employee ID</label>
                <input type="text" id="loginEmpId" class="form-control" placeholder="Enter ID" required>
            </div>
            <div class="form-group mb-4 text-start">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter Password" required>
            </div>
            <!-- Bootstrap Button -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
        </form>
        
        <div class="mt-4">
            <p class="small text-muted">New here? <a href="register.html" class="text-decoration-none">Register Now</a></p>
            <a href="index.html" class="small text-decoration-none">← Back to Home</a>
        </div>
    </div>

    <!-- Bootstrap Success Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <h2 class="text-success mb-3">Success!</h2>
                <p class="lead">Login successful. Welcome back!</p>
                <button class="btn btn-primary mt-3 px-5" onclick="closeLoginModal()">Go to Dashboard</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification (Bootstrap style wrapper) -->
    <div id="toast" class="position-fixed top-0 end-0 p-3" style="z-index: 1060; display: none;">
        <div class="toast show align-items-center text-white bg-dark border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="login.js"></script>
</body>
</html>
